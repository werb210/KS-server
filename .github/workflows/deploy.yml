name: Build and deploy Node.js app to Azure Web App

# BF_SERVER_v789_DEPLOY_AFTER_CI - was `on: push` to main, which deployed in
# parallel with CI, so a commit that failed typecheck, tests or the migration
# replay still reached the staging slot. Now the deploy starts only when the
# "CI" workflow finished successfully for a push to main, and it deploys exactly
# the commit CI tested (workflow_run.head_sha), not whatever main is by then.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: >-
          What to deploy: all (the development copy, the demo server and the shared server), dev (the development copy
          and the demo server) or shared (only the shared server ks-shared-server).
        required: false
        default: all
        type: choice
        options: [all, dev, shared]

concurrency:
  group: deploy-ks-server-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    # KS_SHARED_HOSTING_v1 - a manual run for the shared server only leaves the development copy alone.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target != 'shared') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    env:
      SCM_DO_BUILD_DURING_DEPLOYMENT: false
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested; a manual dispatch deploys the selected ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Install deps
        # BF_SERVER_DEPLOY_NPM_CI_v163 - was: rm -rf node_modules package-lock.json
        # && npm install. Deleting the committed lockfile forced a from-scratch
        # resolve that crashes arborist ("Cannot read properties of null (reading
        # 'edgesOut')") on the vitest 4.x peer graph. npm ci installs
        # deterministically from the committed lock and never hits that path.
        run: npm ci --include=optional

      - name: Clean build artifacts
        run: rm -rf dist

      - name: Build
        run: npm run build

      - name: Prune dev deps
        run: npm prune --omit=dev

      - name: Verify build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # BF_SERVER_v790_DEPLOY_VERIFY_JWT - v789 refuses to start without a real
          # JWT_SECRET; this import check only needs a throwaway one (never used live).
          JWT_SECRET: verify-build-only-${{ github.sha }}
        run: |
          node scripts/verify-build.js
          node -e "require('./dist/routes/auth'); require('./dist/config/env');"

      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x "*.git*" \
               "node_modules/.cache/*" \
               "src/*" \
               "test/*" \
               ".github/*" \
               ".env"

      # Azure login (service principal from AZURE_CREDENTIALS)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # KS_SERVER_v1_LICENSEE - Keystone's development copy (resource group ks-dev). Basic plans have no staging
      # slot, so this deploys straight to the app. AZURE_CREDENTIALS is a service principal limited to ks-dev.
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ks-server-dev
          package: release.zip

      # KS_SERVER_v10_DEMO - the shared sales-demo server (runs with DEMO_MODE=true): the same build, deployed only when
      # the repository variable DEMO_WEBAPP_NAME is set (e.g. ks-demo-server in ks-dev). See KS-Ops docs/DEMO_SETUP.md.
      - name: Deploy to the demo server
        if: vars.DEMO_WEBAPP_NAME != 'off'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.DEMO_WEBAPP_NAME || 'ks-demo-server' }}
          package: release.zip

  # KS_SHARED_HOSTING_v1 - every brokerage now runs on ONE shared server (docs/SHARED_HOSTING.md): the app
  # ks-shared-server in resource group ks-shared, which finds each request's brokerage and database itself. There is no
  # per-licensee matrix any more; deploy/licensees.json is kept as the list of brokerages whose web builds are published.
  # Settings live in the GitHub environment ks-shared (Settings > Environments):
  #   variables AZURE_CLIENT_ID + AZURE_TENANT_ID + AZURE_SUBSCRIPTION_ID  a federated deploy identity (preferred), or
  #   secret    AZURE_CREDENTIALS                                          a service principal limited to ks-shared
  # The app name is the repository variable AZURE_WEBAPP_NAME_SHARED (default ks-shared-server; "off" skips this job).
  # The app's own settings (KS_CONTROL_DATABASE_URL, KS_TENANT_KEY, KS_OPS_SERVICE_KEY and the Keystone-wide keys) are
  # App Service settings written by KS-Ops, never by this workflow. Migrations run on startup, per brokerage database.
  shared-deploy:
    name: deploy shared server
    runs-on: ubuntu-24.04
    if: >-
      vars.AZURE_WEBAPP_NAME_SHARED != 'off' &&
      ((github.event_name == 'workflow_dispatch' && inputs.target != 'dev') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    environment: ks-shared
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-ks-shared-server
      cancel-in-progress: false
    env:
      SCM_DO_BUILD_DURING_DEPLOYMENT: false
      WEBAPP: ${{ vars.AZURE_WEBAPP_NAME_SHARED || 'ks-shared-server' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: Install deps
        run: npm ci --include=optional

      - name: Build
        run: |
          rm -rf dist
          npm run build

      - name: Prune dev deps
        run: npm prune --omit=dev

      # Import check only: nothing connects, so placeholders are enough. KS_CONTROL_DATABASE_URL is set so the build
      # is also imported in multi-brokerage mode.
      - name: Verify build
        env:
          DATABASE_URL: postgres://verify:verify@127.0.0.1:5432/verify
          JWT_SECRET: verify-build-only-${{ github.sha }}
        run: |
          node -e "require('./dist/routes/auth'); require('./dist/config/env');"
          KS_CONTROL_DATABASE_URL=postgres://verify:verify@127.0.0.1:5432/ks_control node -e "import('./dist/tenancy/index.js').then((m) => { if (!m.isMultiBrokerage()) process.exit(1); })"

      - name: Create deployment package
        run: |
          zip -q -r release.zip . \
            -x "*.git*" \
               "node_modules/.cache/*" \
               "src/*" \
               "test/*" \
               ".github/*" \
               ".env"

      - name: Sign-in method
        id: login
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "$AZURE_CREDENTIALS" ]; then
            echo "method=creds" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=ks-shared::Add to the GitHub environment 'ks-shared' the variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID (a federated deploy identity) or the secret AZURE_CREDENTIALS."
            exit 1
          fi
          echo "Deploying to $WEBAPP"

      - name: Azure Login (federated deploy identity)
        if: steps.login.outputs.method == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Login
        if: steps.login.outputs.method == 'creds'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP }}
          package: release.zip
